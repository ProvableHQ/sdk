name: Provable SDK Release
on:
  push:
    tags:
      - 'v*.*.*'

env:
  RUST_BACKTRACE: 1

jobs:
  ubuntu:
    name: Ubuntu
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: nightly-2025-01-16
          override: true
          components: rustfmt

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'yarn'

      - name: Ensure the latest yarn is installed
        run: |
          npm install --global yarn

      - name: Install wasm pack
        run: |
          curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh      

      - name: Build SDK
        run: |
          yarn build:all

      - id: get_version
        uses: battila7/get-version-action@v2

      - name: Zip Source Code and Releases
        run: |
          mkdir -p tempdir/{create-leo-app-dist, sdk-dist, src, wasm-dist}
          cp -r wasm/dist tempdir/wasm-dist
          cp -r sdk/dist tempdir/sdk-dist
          cp -r create-leo-app/dist tempdir/create-leo-app-dist
          rsync -av --progress . tempdir/src --exclude node_modules --exclude tempdir --exclude .git --exclude .github --exclude .zip
          cd tempdir
          zip -r provable-sdk-${{ steps.get_version.outputs.version }}-x86_64-unknown-linux-gnu.zip .
          cd ..
          mv tempdir/provable-sdk-${{ steps.get_version.outputs.version }}-x86_64-unknown-linux-gnu.zip .

      - name: Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            provable-sdk-${{ steps.get_version.outputs.version }}-x86_64-unknown-linux-gnu.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  macos:
    name: macOS
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: nightly-2025-01-16
          override: true
          components: rustfmt

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'yarn'

      - name: Ensure the latest yarn is installed
        run: |
          npm install --global yarn

      - name: Install wasm pack
        run: |
          curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh      

      - name: Build SDK
        run: |
          yarn build:all

      - id: get_version
        uses: battila7/get-version-action@v2

      - name: Zip Source Code and Releases
        run: |
          mkdir -p tempdir/{create-leo-app-dist, sdk-dist, src, wasm-dist}
          cp -r wasm/dist tempdir/wasm-dist
          cp -r sdk/dist tempdir/sdk-dist
          cp -r create-leo-app/dist tempdir/create-leo-app-dist
          rsync -av --progress . tempdir/src --exclude node_modules --exclude tempdir --exclude .git --exclude .github --exclude .zip
          cd tempdir
          zip -r provable-sdk-${{ steps.get_version.outputs.version }}-x86_64-apple-darwin.zip /
          cd ..
          mv tempdir/provable-sdk-${{ steps.get_version.outputs.version }}-x86_64-apple-darwin.zip .

      - name: Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            aleo-${{ steps.get_version.outputs.version }}-x86_64-apple-darwin.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
