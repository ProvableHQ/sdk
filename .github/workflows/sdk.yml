name: SDK

on:
  pull_request:
  push:
    branches:
      - mainnet
      - testnet

env:
  CARGO_TERM_COLOR: always
  PUZZLE_PK: ${{ secrets.PUZZLE_PK }}
  PUZZLE_VK: ${{ secrets.PUZZLE_VK }}
  # edge.provable.com/api is unauthenticated and has no JWT route, so the live
  # scanner suites run in the default `none` auth mode with no key or consumer ID.
  RECORD_SCANNER_URL: https://edge.provable.com/api/scanner


jobs:
  build:
    name: build
    runs-on: ubuntu-latest-m
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-yarn
      - uses: ./.github/actions/setup-rust

      - run: |
          yarn build:all

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build
          path: |
            sdk/dist/
            wasm/dist/
            wasm64/dist/
            create-leo-app/dist/


  test-wasm:
    name: test wasm
    runs-on: ubuntu-latest-m
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-yarn

      - run: |
          yarn test:wasm


  test-sdk:
    name: test sdk
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-yarn
      - uses: ./.github/actions/use-build

      - run: |
          yarn test:sdk


  test-sdk-wasm64:
    name: test sdk (wasm64)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      # Memory64 needs Node.js 24. setup-yarn keeps the active Node.js.
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: ./.github/actions/setup-yarn
      - uses: ./.github/actions/use-build

      - run: |
          yarn test:sdk:wasm64


  e2e:
    name: "e2e"
    runs-on: ubuntu-latest-m
    needs: build
    strategy:
      fail-fast: false
      matrix:
        network: [testnet, mainnet, dynamic]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-yarn
      - uses: ./.github/actions/use-build

      - working-directory: e2e/${{ matrix.network }}
        run: |
          yarn start


  create-leo-app-cli:
    name: "create-leo-app CLI"
    runs-on: ubuntu-latest-m
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-yarn
      - uses: ./.github/actions/use-build

      - working-directory: create-leo-app
        run: |
          npm i -D tsx
          npx tsx src/index.ts test-app --template react-leo


  create-leo-app-build:
    name: "create-leo-app build"
    runs-on: ubuntu-latest-m
    needs: build
    strategy:
      fail-fast: false
      matrix:
        template:
          - extension
          - nextjs-ts
          - offline-public-transaction-ts
          - react-credits-aleo-functions-ts
          - react-leo
          #- react-managed-worker
          - react-ts
          - vanilla
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-yarn
      - uses: ./.github/actions/use-build

      - working-directory: create-leo-app/template-${{ matrix.template }}
        run: |
          yarn build


  create-leo-app-run:
    name: "create-leo-app run"
    runs-on: ubuntu-latest-m
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - template: node
            command: start
          - template: node-credits-aleo-functions-ts
            command: start
          - template: node-ts
            command: test
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-yarn
      - uses: ./.github/actions/use-build

      - working-directory: create-leo-app/template-${{ matrix.template }}
        run: |
          yarn ${{ matrix.command }}


  create-leo-app-loyalty-program-local:
    name: "create-leo-app loyalty-program (local)"
    runs-on: ubuntu-latest-m
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-yarn
      - uses: ./.github/actions/use-build

      - name: Run local mode
        working-directory: create-leo-app/template-node-loyalty-program-ts
        run: |
          yarn local

      - name: Run key caching mode (ProgramImportsBuilder + LocalFileKeyStore)
        working-directory: create-leo-app/template-node-loyalty-program-ts
        run: |
          yarn start:caching


  create-leo-app-dynamic-dispatch:
    name: "create-leo-app dynamic-dispatch (call.dynamic + deep chain)"
    runs-on: ubuntu-latest-m
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-yarn
      - uses: ./.github/actions/use-build

      - name: Run dynamic dispatch and deep chain key caching tests
        working-directory: create-leo-app/template-node-dynamic-dispatch-ts
        timeout-minutes: 10
        run: |
          yarn start

  # Cheap, deterministic, no secrets. Always runs on every PR and push.
  # Exercises: CJS module load (no TLA), Account/signature WASM calls, noble
  # encryption wire format, dynamic variant `require()` from CJS, and
  # `exports`-map consistency via `arethetypeswrong`. The installed-package
  # smoke runs per runtime in `runtime-compat` below.
  cjs-smoke:
    name: "CJS smoke + exports validation"
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-yarn
      - uses: ./.github/actions/use-build

      # Exports-map validation runs first so it gates merging even if the
      # network-dependent e2e job (below) is flaky or skipped.
      - name: "arethetypeswrong exports validation (wasm)"
        working-directory: wasm
        run: yarn test:attw

      - name: "arethetypeswrong exports validation (wasm64)"
        working-directory: wasm64
        run: yarn test:attw

      - name: "arethetypeswrong exports validation (sdk)"
        working-directory: sdk
        run: yarn test:attw

      - name: "Pure-CJS smoke (local, resolves by file path)"
        run: node sdk/tests/cjs-smoke/smoke.cjs


  # Runtime compatibility matrix for the Node.js rows of the README's
  # "Runtime support" table. Each cell packs the workspace packages, installs
  # them into a pristine fixture and loads them through the real `exports`
  # map on one Node.js line, for one WASM variant: `require()` and `import`,
  # the dynamic entry, `initThreadPool` worker spawning and, for wasm64, a
  # local execution on 64-bit shared memory. Catches broken `exports` maps,
  # missing tarball files and wrong `main`/`module` fields that the file-path
  # smoke above cannot see.
  #
  # Memory64 shared memory needs V8 13.6+, i.e. Node.js 24. On older lines
  # the wasm64 cells assert that the entry points throw the documented error
  # and that the wasm32 entry from the same installation still works, so the
  # table's "No" cells are checked, not skipped.
  runtime-compat:
    name: "runtime compat (node ${{ matrix.node }}, ${{ matrix.variant }})"
    runs-on: ubuntu-latest
    needs: build
    strategy:
      fail-fast: false
      matrix:
        node: ["20", "22", "24", "26"]
        variant: [wasm32, wasm64]
        include:
          - node: "20"
            variant: wasm64
            expect: unsupported
          - node: "22"
            variant: wasm64
            expect: unsupported
    steps:
      - uses: actions/checkout@v4
      # setup-yarn runs setup-node without a version and keeps the active
      # Node.js, so the matrix version must be installed first.
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # setup-yarn starts with `corepack enable`, and official Node.js builds
      # stop bundling Corepack from Node.js 25 on. Install it only if missing.
      - name: Ensure Corepack
        run: command -v corepack >/dev/null || npm install --global corepack
      - uses: ./.github/actions/setup-yarn
      - uses: ./.github/actions/use-build

      - name: "Packed-and-installed smoke"
        working-directory: sdk
        timeout-minutes: 10
        run: >-
          node tests/cjs-smoke/pack-install.cjs
          ${{ matrix.variant == 'wasm64' && '--wasm64' || '' }}
          ${{ matrix.expect == 'unsupported' && '--expect-unsupported' || '' }}


  # Verifies that buildExecutionTransaction routes all network calls through
  # the configured transport via QueryOption. Global fetch is replaced with
  # a throwing function to simulate mTLS environments.
  transport-e2e:
    name: "Transport-aware proving (testnet)"
    runs-on: ubuntu-latest-m
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-yarn
      - uses: ./.github/actions/use-build

      - name: Run transport e2e verification
        working-directory: sdk
        timeout-minutes: 10
        run: node tests/transport-e2e.mjs


  create-leo-app-dynamic-dispatch-proving:
    name: "create-leo-app dynamic-dispatch-proving (testnet)"
    runs-on: ubuntu-latest-m
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-yarn
      - uses: ./.github/actions/use-build

      - name: Run dynamic dispatch proving test against testnet
        working-directory: create-leo-app/template-node-dynamic-dispatch-proving-ts
        timeout-minutes: 10
        run: |
          yarn start

  create-leo-app-loyalty-program-delegated:
    name: "create-leo-app loyalty-program (delegated + scanner)"
    runs-on: ubuntu-latest-m
    needs: build
    env:
      # edge.provable.com/api is unauthenticated and has no JWT route, so no
      # consumer ID or API key is passed: the job exercises the default `none`
      # auth mode end to end.
      # DPS configuration
      ALEO_DPS_URL: https://edge.provable.com/api/prove/testnet
      # RSS configuration
      ALEO_RSS_URL: https://edge.provable.com/api/scanner
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-yarn
      - uses: ./.github/actions/use-build

      - name: Run delegated mode (creates on-chain records)
        working-directory: create-leo-app/template-node-loyalty-program-ts
        run: |
          yarn delegated

      - name: Run scanner mode (finds on-chain records)
        working-directory: create-leo-app/template-node-loyalty-program-ts
        run: |
          yarn scanner


  clippy:
    name: "clippy"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        network: [testnet, mainnet]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust

      - name: "cargo clippy"
        working-directory: wasm
        run: |
          cargo clippy --features ${{ matrix.network }}


  rustfmt:
    name: "rustfmt"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust

      - name: "cargo fmt"
        working-directory: wasm
        run: |
          cargo fmt --all --check


  website:
    name: website
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-yarn
      - uses: ./.github/actions/use-build

      - name: Build Website
        working-directory: website
        run: |
          yarn build

      - name: Test Deploy
        id: unmodified
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: gh-pages
          folder: website/dist
          clean-exclude: '["dev"]'
          dry-run: true

      - name: Check step output
        run: |
          [[ \
          ${{steps.unmodified.outputs.deployment-status}} = skipped || \
          ${{steps.unmodified.outputs.deployment-status}} = success \
          ]]
