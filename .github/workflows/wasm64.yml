name: Memory64

on:
    pull_request:
    push:
        branches: [mainnet, testnet]
    workflow_dispatch:

permissions:
    contents: read

jobs:
    build-and-test:
        runs-on: ubuntu-latest
        timeout-minutes: 90
        env:
            CARGO_BUILD_JOBS: "2"
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: "24"
            - uses: ./.github/actions/setup-yarn
            - uses: ./.github/actions/setup-rust
            - name: Build both WASM variants and the SDK
              run: yarn build:wasm && yarn build:wasm64 && yarn build:sdk
            - name: Test wasm32 and Memory64 threading transforms
              working-directory: wasm
              run: >-
                  cargo test --locked --release --manifest-path
                  target/memory64-build/dependencies/wasm-bindgen-cli-support-0.2.129/Cargo.toml
                  --target-dir target/memory64-build/tools --lib
                  transforms::threads::tests
            - name: Validate WASM package exports
              working-directory: wasm
              run: yarn test:attw
            - name: Validate Memory64 WASM package exports
              working-directory: wasm64
              run: yarn test:attw
            - name: Validate SDK package exports
              working-directory: sdk
              run: yarn test:attw
            - name: Test installed wasm32 packages
              working-directory: sdk
              timeout-minutes: 5
              run: yarn test:cjs:pack
            - name:
                  Test installed Memory64 packages (ESM, CJS and Rayon workers)
              working-directory: sdk
              timeout-minutes: 5
              run: yarn test:cjs:pack:wasm64
            - uses: actions/upload-artifact@v4
              with:
                  name: wasm64-build
                  path: |
                      wasm64/dist/
                      sdk/dist/wasm64/
