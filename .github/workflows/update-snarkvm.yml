name: Update snarkVM dependency

on:
  schedule:
    # 08:00 PDT (15:00 UTC). GitHub cron is UTC-only, so during PST (winter)
    # this fires at 07:00 Pacific instead.
    - cron: '0 15 * * *'
  workflow_dispatch:

# Split-job security model, three separations that each hold on their own:
#
#   check    resolves versions. No secrets, nothing untrusted.
#   upgrade  runs Claude over upstream release text and builds the new
#            snarkVM, so it is the job that executes untrusted input. It gets
#            a read-only token and NO test credentials.
#   verify   is the only job holding test credentials. It runs the suite
#            against the finished patch with no Claude in the loop, so
#            injected instructions cannot reach the credentials, and it has
#            no write token either.
#   open-pr  executes nothing from the patch and is the only job that can
#            write to the repo.
#
# Consequence worth stating plainly: `verify` still compiles the new snarkVM
# while holding credentials, so a malicious upstream build script remains a
# path to them. Closing that needs a dedicated revocable test key, not a
# different job layout.
#
# Third-party actions are pinned to full commit SHAs so a moved tag cannot
# inject code.
permissions: {}

concurrency:
  group: update-snarkvm
  cancel-in-progress: false

jobs:
  check:
    name: Check for a new snarkVM release tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      current: ${{ steps.preflight.outputs.CURRENT }}
      latest: ${{ steps.preflight.outputs.LATEST }}
      update_needed: ${{ steps.preflight.outputs.UPDATE_NEEDED }}
      pr_exists: ${{ steps.preflight.outputs.PR_EXISTS }}
      crates_published: ${{ steps.preflight.outputs.CRATES_PUBLISHED }}
    steps:
      - name: Checkout mainnet
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: mainnet

      # Deterministic pre-flight: resolve versions so the (expensive) Claude
      # job is skipped entirely when there is nothing to do.
      - name: Check snarkVM versions
        id: preflight
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          bash .agents/skills/snarkvm-upgrade/scripts/check-version.sh wasm/Cargo.toml | tee -a "$GITHUB_OUTPUT"

          # Also skip if an upgrade PR for the target tag is already open.
          # Scoped to the exact tag on purpose: a stale open PR for an older
          # tag should not block a newer upgrade.
          LATEST=$(grep '^LATEST=' "$GITHUB_OUTPUT" | tail -1 | cut -d= -f2)
          # --head filters server-side by branch, so the check cannot miss a
          # PR beyond the listing's default page size.
          OPEN_COUNT=$(gh pr list --state open --head "update-snarkvm-${LATEST}" --json number --jq length)
          if [ "$OPEN_COUNT" -gt 0 ]; then
            echo "PR_EXISTS=true" >> "$GITHUB_OUTPUT"
          else
            echo "PR_EXISTS=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Summary
        if: always()
        env:
          CURRENT: ${{ steps.preflight.outputs.CURRENT }}
          LATEST: ${{ steps.preflight.outputs.LATEST }}
          UPDATE_NEEDED: ${{ steps.preflight.outputs.UPDATE_NEEDED }}
          PR_EXISTS: ${{ steps.preflight.outputs.PR_EXISTS }}
          CRATES_PUBLISHED: ${{ steps.preflight.outputs.CRATES_PUBLISHED }}
        run: |
          {
            echo "## snarkVM upgrade check"
            echo "- Current: ${CURRENT}"
            echo "- Latest tag: ${LATEST}"
            echo "- Update needed: ${UPDATE_NEEDED}"
            echo "- Upgrade PR already open: ${PR_EXISTS}"
            echo "- crates.io published: ${CRATES_PUBLISHED}"
          } >> "$GITHUB_STEP_SUMMARY"

  upgrade:
    name: Upgrade snarkVM to ${{ needs.check.outputs.latest }}
    needs: check
    if: needs.check.outputs.update_needed == 'true' && needs.check.outputs.pr_exists == 'false'
    runs-on: ubuntu-latest-m
    timeout-minutes: 120
    # Read-only on purpose: this job runs the new snarkVM's build scripts and
    # feeds upstream release text to Claude, so it must not hold a token that
    # can write to the repo. The upgrade leaves CI as a patch artifact.
    permissions:
      contents: read
    steps:
      - name: Checkout mainnet
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: mainnet

      - name: Set up yarn
        uses: ./.github/actions/setup-yarn

      - name: Set up rust
        uses: ./.github/actions/setup-rust

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # No test credentials here by design. Upstream release text reaches
      # Claude in this step, so anything in its environment is reachable by an
      # injected instruction. The skill therefore only builds in CI; the
      # `verify` job below owns the test suite and is authoritative.
      - name: Run the snarkvm-upgrade skill
        uses: anthropics/claude-code-action@be7b93b1907a4abad570368f3c74b6fe3807510b # v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: /snarkvm-upgrade
          # Entries with spaces MUST stay quoted: the action shell-tokenizes
          # claude_args, so an unquoted Bash(yarn *) splits into two broken
          # rules and the allowlist silently stops matching anything. No curl
          # here — the check script covers the one crates.io lookup, and a
          # generic curl would be a prompt-injection exfiltration channel.
          claude_args: >-
            --allowedTools
            "Bash(bash .agents/skills/snarkvm-upgrade/scripts/check-version.sh*)"
            "Bash(yarn *)" "Bash(cargo *)" "Bash(npm view:*)" "Bash(git *)"
            "Bash(gh *)" "Bash(head *)" "Bash(tail *)" "Bash(sort *)"
            "Bash(grep *)" "Bash(sed *)" "Bash(awk *)" "Bash(cat *)"
            "Bash(ls *)" Read Write Edit Glob Grep

      # Fails the job — and therefore the run — when Claude stopped without
      # delivering a committed branch and a PR body. This only proves that
      # something was produced; `verify` decides whether it works.
      - name: Package the upgrade as a patch artifact
        env:
          LATEST: ${{ needs.check.outputs.latest }}
        run: |
          git format-patch "mainnet..update-snarkvm-${LATEST}" --stdout > upgrade.patch
          test -s upgrade.patch
          cp /tmp/pr-body.md pr-body.md
          test -s pr-body.md

      - name: Upload the patch artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: snarkvm-upgrade
          path: |
            upgrade.patch
            pr-body.md
          retention-days: 7
          if-no-files-found: error

  # The gate that makes "never open a PR with failing tests" enforceable
  # instead of merely instructed. Claude does not run the suite in CI and does
  # not hold the credentials for it; this job does, with no Claude in the loop.
  verify:
    name: Verify the upgrade against the test suite
    needs: [check, upgrade]
    runs-on: ubuntu-latest-m
    timeout-minutes: 120
    permissions:
      contents: read
    env:
      LATEST: ${{ needs.check.outputs.latest }}
      PUZZLE_PK: ${{ secrets.PUZZLE_PK }}
      PUZZLE_VK: ${{ secrets.PUZZLE_VK }}
      RECORD_SCANNER_URL: ${{ secrets.RECORD_SCANNER_URL }}
      KONG_API_KEY: ${{ secrets.ALEO_DPS_API_KEY }}
      CONSUMER_ID: ${{ secrets.ALEO_CONSUMER_ID }}
    steps:
      - name: Checkout mainnet
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: mainnet

      - name: Download the patch artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: snarkvm-upgrade
          path: /tmp/upgrade-artifact

      # Runs before the patch is applied and before anything is compiled, so a
      # patch carrying credentials is rejected while this job has still
      # executed nothing from it. Claude can commit files and write the PR
      # body, and open-pr's own refusal check filters paths rather than
      # content, so this is the step that closes the publish path.
      #
      # RECORD_SCANNER_URL is deliberately not scanned: it is a plain endpoint
      # that already appears verbatim in the create-leo-app templates, so it
      # would match legitimate diffs. Values are only ever named, never echoed.
      - name: Refuse a patch carrying secret material
        run: |
          status=0
          for name in PUZZLE_PK PUZZLE_VK KONG_API_KEY CONSUMER_ID; do
            value="${!name}"
            # A short or unset secret would make grep -F match everything and
            # wedge the pipeline, so only scan values long enough to be real.
            if [ "${#value}" -lt 12 ]; then
              echo "::warning::${name} is unset or too short to scan."
              continue
            fi
            if grep -qF -- "$value" \
                /tmp/upgrade-artifact/upgrade.patch \
                /tmp/upgrade-artifact/pr-body.md; then
              echo "::error::Patch or PR body contains the value of ${name} — refusing to publish."
              status=1
            fi
          done
          exit $status

      - name: Apply and validate the patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "update-snarkvm-${LATEST}"
          git am /tmp/upgrade-artifact/upgrade.patch

          # Same refusal open-pr applies, enforced here as well and for a
          # second reason: the setup-yarn and setup-rust composite actions
          # below are read from this working tree, so a patch touching
          # .github/ would get to run its own code in a job holding the test
          # credentials. Nothing from the patch has executed yet at this point.
          if git diff --name-only "mainnet..HEAD" | grep -E '^(\.github/|\.agents/|\.claude/)'; then
            echo "::error::Patch modifies workflow or agent configuration — refusing to verify."
            exit 1
          fi

      - name: Set up yarn
        uses: ./.github/actions/setup-yarn

      - name: Set up rust
        uses: ./.github/actions/setup-rust

      # Same order the skill documents, and the order the repo requires: wasm
      # is built before the SDK bundles that depend on its output.
      - name: yarn test:wasm
        run: yarn test:wasm

      - name: yarn build:all
        run: yarn build:all

      - name: yarn test:sdk
        run: yarn test:sdk

  open-pr:
    name: Open the upgrade PR
    needs: [check, upgrade, verify]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      LATEST: ${{ needs.check.outputs.latest }}
    steps:
      - name: Checkout mainnet
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: mainnet

      - name: Download the patch artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: snarkvm-upgrade

      - name: Apply and validate the patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "update-snarkvm-${LATEST}"
          git am upgrade.patch

          # The read-only job's output must not modify the automation that
          # publishes it — refuse patches touching CI or agent config.
          if git diff --name-only "mainnet..HEAD" | grep -E '^(\.github/|\.agents/|\.claude/)'; then
            echo "::error::Patch modifies workflow or agent configuration — refusing to publish."
            exit 1
          fi

      - name: Push and open the PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Force push: a closed or abandoned upgrade PR leaves a stale
          # update-snarkvm-<tag> branch behind that would reject a plain
          # push. Only this automation writes to that branch namespace, and
          # the pre-flight guarantees no PR for this tag is open.
          git push --force -u origin "update-snarkvm-${LATEST}"
          # PRs opened with the default GITHUB_TOKEN do not trigger CI
          # workflows (GitHub restriction). Swap in a PAT or GitHub App token
          # if the upgrade PRs should run the SDK CI automatically.
          gh pr create --base mainnet \
            --title "Update snarkVM to ${LATEST}" \
            --body-file pr-body.md
