name: Check for a snarkVM release

on:
  schedule:
    # 08:00 PDT (15:00 UTC). GitHub cron is UTC-only, so during PST (winter)
    # this fires at 07:00 Pacific instead.
    - cron: '0 15 * * *'
  workflow_dispatch:

# Notification only. This workflow resolves versions and files an issue; it
# never edits the repo and it does not perform the upgrade.
#
# The upgrade is deliberately left to a person. Its inner loop is build, read
# the error, edit, build again, and `yarn build:all` takes ~8 minutes on these
# runners WITH a warm cache — which bumping snarkVM invalidates by definition,
# so every cycle approaches a cold build of snarkvm and its whole dependency
# tree. A few cycles exhaust any sane timeout, and there is no resume. That
# work belongs somewhere with incremental compiles.
#
# Resolving a tag needs no iteration and no judgment, which is what a cron is
# good at, and is all this does.
permissions: {}

concurrency:
  group: update-snarkvm
  cancel-in-progress: false

jobs:
  check:
    name: Check for a new snarkVM release tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      # Follows the dispatched ref rather than hardcoding mainnet, so the
      # workflow can be exercised from a branch. Scheduled runs only ever fire
      # on the default branch, so this is `mainnet` for every automated run.
      - name: Checkout the base branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Resolve the current pin and the latest release tag
        id: preflight
        run: |
          set -o pipefail
          bash scripts/check-snarkvm-version.sh wasm/Cargo.toml | tee -a "$GITHUB_OUTPUT"

      - name: Summary
        if: always()
        env:
          CURRENT: ${{ steps.preflight.outputs.CURRENT }}
          LATEST: ${{ steps.preflight.outputs.LATEST }}
          UPDATE_NEEDED: ${{ steps.preflight.outputs.UPDATE_NEEDED }}
          CRATES_PUBLISHED: ${{ steps.preflight.outputs.CRATES_PUBLISHED }}
          PIN_STYLE: ${{ steps.preflight.outputs.PIN_STYLE }}
        run: |
          {
            echo "## snarkVM release check"
            echo "- Current: ${CURRENT:-unknown} (pinned by \`${PIN_STYLE}\`)"
            echo "- Latest tag: ${LATEST}"
            echo "- Update needed: ${UPDATE_NEEDED}"
            echo "- crates.io published: ${CRATES_PUBLISHED:-n/a}"
          } >> "$GITHUB_STEP_SUMMARY"

      # One open issue per target tag. Re-running daily must not pile up
      # duplicates, and an issue for an older tag must not suppress a newer
      # one. The /issues endpoint returns pull requests too, hence the
      # `.pull_request == null` filter, and LATEST is passed to jq through the
      # environment rather than interpolated into the filter string.
      - name: Look for an existing issue for this tag
        id: existing
        if: steps.preflight.outputs.UPDATE_NEEDED == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          LATEST: ${{ steps.preflight.outputs.LATEST }}
        run: |
          COUNT=$(gh api --paginate --method GET "repos/${GITHUB_REPOSITORY}/issues" \
            -f state=open -f per_page=100 \
            --jq '[.[] | select(.pull_request == null)
                       | select(.title | startswith("snarkVM " + env.LATEST + " is available"))] | length')
          echo "COUNT=${COUNT:-0}" >> "$GITHUB_OUTPUT"

      - name: Open an issue
        if: steps.preflight.outputs.UPDATE_NEEDED == 'true' && steps.existing.outputs.COUNT == '0'
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT: ${{ steps.preflight.outputs.CURRENT }}
          LATEST: ${{ steps.preflight.outputs.LATEST }}
          CRATES_PUBLISHED: ${{ steps.preflight.outputs.CRATES_PUBLISHED }}
          PIN_STYLE: ${{ steps.preflight.outputs.PIN_STYLE }}
        run: |
          {
            echo "snarkVM **${LATEST}** is available."
            echo
            if [ -n "$CURRENT" ]; then
              echo "The SDK is on **${CURRENT}**, pinned by \`${PIN_STYLE}\`."
            else
              echo "The SDK is pinned by \`${PIN_STYLE}\` to a commit that carries no"
              echo "release tag, so the current version could not be resolved."
            fi
            echo
            if [ "$CRATES_PUBLISHED" = "true" ]; then
              echo "Every \`snarkvm-*\` crate is published on crates.io at \`${LATEST#v}\`,"
              echo "so the upgrade should pin with \`version\` and drop \`git\`/\`rev\`."
            else
              echo "Not every \`snarkvm-*\` crate is on crates.io at \`${LATEST#v}\` yet, so"
              echo "the upgrade should keep the \`git\` source and pin \`tag = \"${LATEST}\"\`."
            fi
            echo
            echo "### Upstream"
            echo
            if [ -n "$CURRENT" ]; then
              echo "- Changeset: https://github.com/ProvableHQ/snarkVM/compare/${CURRENT}...${LATEST}"
            fi
            echo "- Release notes: https://github.com/ProvableHQ/snarkVM/releases/tag/${LATEST}"
            echo
            echo "### To upgrade"
            echo
            echo "Rewrite all ten \`[dependencies.snarkvm-*]\` blocks in \`wasm/Cargo.toml\`,"
            echo "migrate \`wasm/src/\` and then \`sdk/src/\` for any API changes, and bump the"
            echo "package and crate versions with \`yarn change-version <version>\`."
            echo
            echo "Verify with:"
            echo
            echo '```'
            echo "yarn test:wasm && yarn build:all && yarn test:sdk"
            echo '```'
            echo
            echo "\`PUZZLE_PK\` and \`PUZZLE_VK\` must be exported — several tests decrypt"
            echo "fixtures with them and fail outright when unset."
            echo
            echo "The full procedure, including migration patterns seen in previous"
            echo "upgrades, is written up in \`.agents/skills/snarkvm-upgrade/SKILL.md\`."
          } > issue-body.md

          gh issue create \
            --title "snarkVM ${LATEST} is available (SDK on ${CURRENT:-an untagged rev})" \
            --body-file issue-body.md
