name: Check for a snarkVM release

on:
  schedule:
    # 08:00 PDT (15:00 UTC). GitHub cron is UTC-only, so during PST (winter)
    # this fires at 07:00 Pacific instead.
    - cron: '0 15 * * *'
  workflow_dispatch:

# This workflow notices upgrades. It does not perform them.
#
# An earlier version of this file ran the migration itself, driving Claude over
# the new snarkVM inside CI. That was the wrong venue and the work is better
# done elsewhere:
#
#   - The inner loop of a snarkVM migration is build, read the error, edit,
#     build again. `yarn build:all` takes ~8 minutes here WITH a warm cache,
#     and bumping snarkVM invalidates that cache by definition, so each cycle
#     approaches a cold build of snarkvm and its whole dependency tree. A
#     handful of cycles exhausts any sane job timeout, and there is no resume:
#     timing out at 80% discards everything.
#   - CI is non-interactive, so a permission denial is fatal and invisible
#     rather than a question. Exploratory migration work is exactly the case
#     where asking a human is the right move.
#
# So the split is along "does this need iteration and judgment". Resolving a
# tag does not, and is what a cron is good at. Migrating does, and belongs in
# an interactive session — run `/snarkvm-upgrade` locally, where compiles are
# incremental and a human is in the loop. See
# .agents/skills/snarkvm-upgrade/SKILL.md.
permissions: {}

concurrency:
  group: update-snarkvm
  cancel-in-progress: false

jobs:
  check:
    name: Check for a new snarkVM release tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      # Follows the dispatched ref rather than hardcoding mainnet, so the
      # workflow can be exercised from a branch. Scheduled runs only ever fire
      # on the default branch, so this is `mainnet` for every automated run.
      - name: Checkout the base branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.ref_name }}

      - name: Resolve the current pin and the latest release tag
        id: preflight
        run: |
          set -o pipefail
          bash .agents/skills/snarkvm-upgrade/scripts/check-version.sh wasm/Cargo.toml | tee -a "$GITHUB_OUTPUT"

      - name: Summary
        if: always()
        env:
          CURRENT: ${{ steps.preflight.outputs.CURRENT }}
          LATEST: ${{ steps.preflight.outputs.LATEST }}
          UPDATE_NEEDED: ${{ steps.preflight.outputs.UPDATE_NEEDED }}
          CRATES_PUBLISHED: ${{ steps.preflight.outputs.CRATES_PUBLISHED }}
          PIN_STYLE: ${{ steps.preflight.outputs.PIN_STYLE }}
        run: |
          {
            echo "## snarkVM release check"
            echo "- Current: ${CURRENT:-unknown} (pinned by \`${PIN_STYLE}\`)"
            echo "- Latest tag: ${LATEST}"
            echo "- Update needed: ${UPDATE_NEEDED}"
            echo "- crates.io published: ${CRATES_PUBLISHED:-n/a}"
          } >> "$GITHUB_STEP_SUMMARY"

      # One open issue per target tag. Re-running daily must not pile up
      # duplicates, and an issue for an older tag must not suppress a newer
      # one. The /issues endpoint returns pull requests too, hence the
      # `.pull_request == null` filter, and LATEST is passed to jq through the
      # environment rather than interpolated into the filter string.
      - name: Look for an existing issue for this tag
        id: existing
        if: steps.preflight.outputs.UPDATE_NEEDED == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          LATEST: ${{ steps.preflight.outputs.LATEST }}
        run: |
          COUNT=$(gh api --paginate --method GET "repos/${GITHUB_REPOSITORY}/issues" \
            -f state=open -f per_page=100 \
            --jq '[.[] | select(.pull_request == null)
                       | select(.title | startswith("snarkVM " + env.LATEST + " is available"))] | length')
          echo "COUNT=${COUNT:-0}" >> "$GITHUB_OUTPUT"

      - name: Open an issue
        if: steps.preflight.outputs.UPDATE_NEEDED == 'true' && steps.existing.outputs.COUNT == '0'
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT: ${{ steps.preflight.outputs.CURRENT }}
          LATEST: ${{ steps.preflight.outputs.LATEST }}
          CRATES_PUBLISHED: ${{ steps.preflight.outputs.CRATES_PUBLISHED }}
          PIN_STYLE: ${{ steps.preflight.outputs.PIN_STYLE }}
        run: |
          {
            echo "snarkVM **${LATEST}** is available."
            echo
            if [ -n "$CURRENT" ]; then
              echo "The SDK is on **${CURRENT}**, pinned by \`${PIN_STYLE}\`."
            else
              echo "The SDK is pinned by \`${PIN_STYLE}\` to a commit that carries no"
              echo "release tag, so the current version could not be resolved."
            fi
            echo
            if [ "$CRATES_PUBLISHED" = "true" ]; then
              echo "Every \`snarkvm-*\` crate is published on crates.io at \`${LATEST#v}\`,"
              echo "so the upgrade should pin with \`version\` and drop \`git\`/\`rev\`."
            else
              echo "Not every \`snarkvm-*\` crate is on crates.io at \`${LATEST#v}\` yet, so"
              echo "the upgrade should keep the \`git\` source and pin \`tag = \"${LATEST}\"\`."
            fi
            echo
            echo "### Upstream"
            echo
            if [ -n "$CURRENT" ]; then
              echo "- Changeset: https://github.com/ProvableHQ/snarkVM/compare/${CURRENT}...${LATEST}"
            fi
            echo "- Release notes: https://github.com/ProvableHQ/snarkVM/releases/tag/${LATEST}"
            echo
            echo "### To upgrade"
            echo
            echo "From a clean \`mainnet\` checkout, run:"
            echo
            echo '```'
            echo "/snarkvm-upgrade"
            echo '```'
            echo
            echo "The procedure is in \`.agents/skills/snarkvm-upgrade/SKILL.md\`. It reviews"
            echo "the upstream changeset, migrates \`wasm/\` then \`sdk/\`, runs the full test"
            echo "suite, bumps the package and crate versions, and opens the PR."
            echo
            echo "Migration is deliberately not automated here — the build-edit-build loop"
            echo "needs incremental compiles and a human in the loop, neither of which a"
            echo "cold CI runner provides. See the comment at the top of"
            echo "\`.github/workflows/update-snarkvm.yml\`."
          } > issue-body.md

          gh issue create \
            --title "snarkVM ${LATEST} is available (SDK on ${CURRENT:-an untagged rev})" \
            --body-file issue-body.md
