name: Setup Rust
description: Sets up Rust
inputs:
    memory64:
        description:
            Install the additional toolchains used by the Memory64 build
        default: "false"
runs:
    using: "composite"
    steps:
        - uses: actions/cache@v4
          with:
              path: |
                  ~/.cargo/registry
                  ~/.cargo/git
                  target
                  wasm/target
              key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

        - name: Initialize Rustup
          shell: bash
          run: |
              rustup show

        - name: Install Memory64 toolchains
          if: inputs.memory64 == 'true'
          shell: bash
          run: |
              rustup toolchain install 1.96.0 --profile minimal
              rustup toolchain install nightly-2026-04-02 --profile minimal --component rust-src
