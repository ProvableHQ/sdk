name: Setup Rust
description: Sets up Rust
runs:
    using: "composite"
    steps:
        - uses: actions/cache@v4
          with:
              path: |
                  ~/.cargo/registry
                  ~/.cargo/git
                  target
              key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

        - name: Initialize Rustup
          shell: bash
          run: |
              rustup show
