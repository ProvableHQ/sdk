[package]
name = "aleo-wasm-address"
version = "0.9.16"
authors = ["The Provable Team"]
description = "Minimal WebAssembly bindings for Aleo address operations"
homepage = "https://provable.com"
repository = "https://github.com/ProvableHQ/sdk"
keywords = ["aleo", "cryptography", "blockchain", "decentralized", "zero-knowledge"]
categories = ["cryptography::cryptocurrencies"]
include = ["Cargo.toml", "src", "LICENSE.md"]
license = "GPL-3.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[dependencies.snarkvm-console]
version = "4.4.0"
default-features = false
features = [
    "account",
    "algorithms",
    "network",
    "types",
    "wasm",
]

[dependencies.anyhow]
version = "1.0"

[dependencies.getrandom]
version = "0.2"
features = ["js"]

[dependencies.js-sys]
version = "0.3"

[dependencies.wasm-bindgen]
version = "0.2.100"
features = ["serde-serialize"]

[build-dependencies.walkdir]
version = "2"

[dev-dependencies.wasm-bindgen-test]
version = "0.3.50"

[features]
default = ["serial"]
serial = ["snarkvm-console/serial"]

[profile.release]
opt-level = 3
lto = true
strip = true

[profile.dev]
opt-level = 3
lto = "thin"
incremental = true
